  html,body{margin:0;padding:0;background:#0D0620;color:#FCF4EA;

<body>
<style>
:root{
  --gece:#0B0518;
  --sis:#B0A0D6;
  --krem:#FDF6EC;
  --altin:#F8CE85;
  --seftali:#FFE4BF;
  --gul:#FF7FA2;
  --gul2:#FFC0CE;
  --d:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --g:'Manrope','Segoe UI',system-ui,sans-serif;
  --ust-p:env(safe-area-inset-top,0px);
  --alt-p:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--gece); color:var(--krem);
  font-family:var(--g); font-size:15px; line-height:1.5;
  overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none}

#dunya{
  position:fixed; inset:0; display:flex; flex-direction:column;
  max-width:520px; margin:0 auto;
  padding-top:var(--ust-p); padding-bottom:var(--alt-p);
  background:linear-gradient(180deg,#070312 0%, #150A2C 34%, #2A1146 68%, #451C4E 100%);
}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#arka{z-index:0;pointer-events:none}
#oyun{z-index:1;touch-action:none}

/* ---------- üst ---------- */
#ust{
  position:relative; z-index:7; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:13px 16px 4px; min-height:46px;
}
#sesbtn{
  position:absolute; left:12px; top:50%; transform:translateY(-45%);
  width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
  cursor:pointer; opacity:.55; transition:opacity .3s;
}
#sesbtn:active{opacity:1}
#sesbtn svg{width:20px;height:20px;display:block}
.kp{width:26px;height:24px;transition:transform .6s cubic-bezier(.34,1.7,.5,1)}
.kp .dolu{opacity:0;transition:opacity .8s ease}
.kp.var .dolu{opacity:1}
.kp.var{transform:scale(1.22)}

/* ---------- sahne ---------- */
#sahne{position:relative; z-index:2; flex:1 1 auto; min-height:300px; overflow:hidden}
#ui{position:absolute;inset:0;z-index:3;pointer-events:none}
#ui>*{pointer-events:auto}

/* ---------- alt ---------- */
#alt{
  position:relative; z-index:7; flex:0 0 auto; text-align:center; padding:10px 26px 20px;
}
#alt::before{
  content:''; position:absolute; left:0; right:0; bottom:0; top:-46px; z-index:-1;
  background:linear-gradient(180deg, rgba(11,5,24,0) 0%, rgba(11,5,24,.72) 46%, rgba(11,5,24,.9) 100%);
  pointer-events:none;
}
#basl{
  font-family:var(--d); font-weight:500; font-size:31px; line-height:1.08;
  margin:0 0 4px; text-wrap:balance; letter-spacing:.01em;
}
#aciklama{margin:0 auto; max-width:min(320px,94%); color:#C9BCE4; font-size:14px;
  min-height:2.5em; line-height:1.5}
#aciklama b{color:var(--seftali);font-weight:600}
#sayac{
  font-family:var(--d); font-style:italic; font-size:20px; color:var(--seftali);
  letter-spacing:.1em; font-variant-numeric:tabular-nums; min-height:1.4em; margin-top:3px;
}

.btn{
  cursor:pointer; border-radius:999px; padding:15px 40px;
  background:linear-gradient(180deg,#FFD6E0,var(--gul));
  color:#4B0F23; font-weight:700; font-size:16px; letter-spacing:.01em;
  box-shadow:0 12px 34px rgba(255,127,162,.36), inset 0 1px 0 rgba(255,255,255,.65);
  transition:transform .2s cubic-bezier(.34,1.6,.6,1);
}
.btn:active{transform:scale(.95)}
.btn.altin{background:linear-gradient(180deg,var(--seftali),var(--altin));color:#4C3308;
  box-shadow:0 12px 34px rgba(248,206,133,.3), inset 0 1px 0 rgba(255,255,255,.6)}
.nabiz{animation:nabiz 2.8s ease-in-out infinite}
@keyframes nabiz{0%,100%{box-shadow:0 12px 34px rgba(255,127,162,.3), inset 0 1px 0 rgba(255,255,255,.65)}
  50%{box-shadow:0 12px 46px rgba(255,127,162,.6), inset 0 1px 0 rgba(255,255,255,.65)}}
:focus-visible{outline:2px solid var(--altin);outline-offset:3px;border-radius:8px}

/* ---------- süsleme ---------- */
.susleme{display:flex;align-items:center;gap:11px;justify-content:center}
.susleme i{display:block;height:1px;width:52px;
  background:linear-gradient(90deg,transparent,rgba(248,206,133,.85))}
.susleme i+i{background:linear-gradient(90deg,rgba(248,206,133,.85),transparent)}
.susleme svg{width:13px;height:12px;display:block;flex:0 0 auto}

/* ---------- açılış ---------- */
#acilis{
  position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:32px 28px;
  padding-top:calc(28px + var(--ust-p)); padding-bottom:calc(28px + var(--alt-p));
}
#acilis>*{animation:gir 1.25s cubic-bezier(.18,.9,.28,1) both}
#acilis>*:nth-child(1){animation-delay:.15s}
#acilis>*:nth-child(2){animation-delay:.35s}
#acilis>*:nth-child(3){animation-delay:.72s}
#acilis>*:nth-child(4){animation-delay:.95s}
#acilis>*:nth-child(5){animation-delay:1.25s}
#acilis>*:nth-child(6){animation-delay:1.5s}
@keyframes gir{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#acilis .ust{font-size:10px;letter-spacing:.46em;text-transform:uppercase;
  color:var(--altin);opacity:.75;margin:0 0 18px;padding-left:.46em}
#acilis .ad{
  font-family:var(--d); font-weight:300; font-style:italic; font-size:clamp(60px,19vw,92px);
  line-height:.9; margin:0; color:#FFFDF9; letter-spacing:.005em;
  text-shadow:0 0 70px rgba(255,192,206,.5), 0 0 24px rgba(255,192,206,.28),
              0 2px 30px rgba(0,0,0,.4);
}
#acilis .susleme{margin:26px 0 22px}
#acilis .not{
  font-family:var(--d); font-style:italic; font-weight:400; font-size:23px; line-height:1.44;
  color:var(--seftali); margin:0 0 36px; max-width:min(310px,92%);
  text-shadow:0 2px 18px rgba(0,0,0,.5);
}
#acilis .imza{font-size:9.5px;letter-spacing:.36em;text-transform:uppercase;
  color:var(--sis);opacity:.5;margin-top:30px;padding-left:.36em}

/* ---------- aşk kartı ---------- */
#kart{
  position:absolute; inset:0; z-index:22; display:none; align-items:center; justify-content:center;
  padding:30px 26px; background:rgba(7,3,18,.74);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
#kart.ac{display:flex}
#kartic{
  position:relative; width:100%; max-width:345px; padding:44px 30px 30px; text-align:center;
  border-radius:22px;
  background:linear-gradient(168deg,#3E245E 0%, #2C1443 58%, #3A1740 100%);
  border:1px solid rgba(248,206,133,.32);
  box-shadow:0 34px 78px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.14),
             0 0 70px rgba(255,127,162,.13);
  animation:kartGel .75s cubic-bezier(.2,1.25,.4,1) both;
}
@keyframes kartGel{from{opacity:0;transform:translateY(28px) scale(.93)}to{opacity:1;transform:none}}
#kartic .muhur{
  position:absolute; top:-21px; left:50%; margin-left:-21px; width:42px; height:42px;
  border-radius:50%; background:radial-gradient(circle at 36% 30%,#FFA3BC,#CE3D6A);
  display:grid; place-items:center; box-shadow:0 10px 26px rgba(206,61,106,.55)
}
#kartic .muhur svg{width:21px;height:19px}
#kartyazi{
  font-family:var(--d); font-style:italic; font-weight:400; font-size:25px; line-height:1.42;
  color:var(--krem); margin:2px 0 0;
}
#kartimza{font-family:var(--d); font-style:italic; font-size:17px; color:var(--altin);
  margin:18px 0 24px; letter-spacing:.08em}

/* ---------- final ---------- */
#son{
  position:absolute; inset:0; z-index:24; display:none; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:26px; overflow-y:auto;
  padding-top:calc(22px + var(--ust-p)); padding-bottom:calc(22px + var(--alt-p));
}
#son.ac{display:flex}
#son h2{font-family:var(--d);font-weight:300;font-style:italic;font-size:50px;margin:0;
  line-height:1;text-shadow:0 0 60px rgba(255,192,206,.45)}
#son .susleme{margin:22px 0}
#son .mesaj{
  font-family:var(--d); font-style:italic; font-weight:400; font-size:26px; line-height:1.44;
  color:var(--seftali); max-width:min(330px,94%); margin:0; white-space:pre-line;
  text-shadow:0 2px 18px rgba(0,0,0,.5);
}
#son .gizli{
  margin:26px 0 0; padding:16px 20px; border-radius:16px;
  background:rgba(255,127,162,.09); border:1px solid rgba(255,127,162,.26);
  font-family:var(--d); font-style:italic; font-weight:500; font-size:20px; line-height:1.4;
  color:var(--gul2); white-space:pre-line; max-width:min(320px,94%);
}
#son .imza{font-family:var(--d);font-style:italic;font-size:19px;color:var(--altin);
  margin:24px 0 0;letter-spacing:.09em}
#son .kucuk{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--sis);
  opacity:.4;margin:32px 0 10px;padding-left:.34em}
#son .tekrar{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
#son .tekrar button{
  border:1px solid rgba(248,206,133,.24); border-radius:999px; padding:8px 16px;
  font-size:12px; color:var(--krem); cursor:pointer; background:rgba(255,255,255,.03)
}
#son .tekrar button:active{background:rgba(248,206,133,.16)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important}}
@media (max-height:700px){
  #basl{font-size:26px} #alt{padding:6px 24px 14px}
  #son h2{font-size:40px} #son .mesaj{font-size:23px} #son .gizli{font-size:18px}
  #acilis .not{font-size:20px;margin-bottom:28px} #acilis .susleme{margin:20px 0 16px}
}
</style>

<div id="dunya">
  <canvas id="arka"></canvas>

  <div id="ust" hidden>
    <button id="sesbtn" aria-label="Sesi aç kapat"></button>
    <div id="kalpler"></div>
  </div>

  <div id="sahne">
    <canvas id="oyun"></canvas>
    <div id="ui"></div>
  </div>

  <div id="alt" hidden>
    <h2 id="basl"></h2>
    <p id="aciklama"></p>
    <div id="sayac"></div>
  </div>

  <div id="acilis">
    <p class="ust">Ahmet'ten</p>
    <h1 class="ad">Tuana</h1>
    <div class="susleme">
      <i></i>
      <svg viewBox="0 0 24 22" fill="#F8CE85"><path d="M12 21C6 17 1 13 1 8a6 6 0 0 1 11-3.4A6 6 0 0 1 23 8c0 5-5 9-11 13Z"/></svg>
      <i></i>
    </div>
    <p class="not" id="acilisnot"></p>
    <button class="btn nabiz" id="baslabtn">Başla</button>
    <p class="imza">üç oyun · üç kalp</p>
  </div>

  <div id="kart">
    <div id="kartic">
      <div class="muhur">
        <svg viewBox="0 0 24 22" fill="#FFF4F7"><path d="M12 21C6 17 1 13 1 8a6 6 0 0 1 11-3.4A6 6 0 0 1 23 8c0 5-5 9-11 13Z"/></svg>
      </div>
      <p id="kartyazi"></p>
      <p id="kartimza"></p>
      <button class="btn altin" id="kartbtn">Devam</button>
    </div>
  </div>

  <div id="son">
    <h2 id="sonbaslik"></h2>
    <div class="susleme">
      <i></i>
      <svg viewBox="0 0 24 22" fill="#F8CE85"><path d="M12 21C6 17 1 13 1 8a6 6 0 0 1 11-3.4A6 6 0 0 1 23 8c0 5-5 9-11 13Z"/></svg>
      <i></i>
    </div>
    <p class="mesaj" id="sonmesaj"></p>
    <p class="gizli" id="songizli"></p>
    <p class="imza" id="sonimza"></p>
    <p class="kucuk">tekrar oynamak istersen</p>
    <div class="tekrar" id="tekrar"></div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   AHMET — DEĞİŞTİRECEĞİN HER ŞEY BURADA
   ═══════════════════════════════════════════════════════════ */
const SEN = 'Ahmet';
const O   = 'Tuana';

const ACILIS_NOTU = 'Sana söyleyeceklerimi bu gecenin içine sakladım.';

/* oyunlar arasında çıkan iki not */
const NOTLAR = [
  'Sen dokundukça çoğalıyorlar aşkım. Ben de öyleyim.',
  'O haritayı çoktan çizmiştim bitanem. Sen sadece birleştirdin.'
];

/* final */
const FINAL_BASLIK = 'Tuanam';
const FINAL_MESAJ  = 'Seni seviyorum Tuana.\nBitanem, hayatım, canımın içi.';
/* sadece ikinizin anladığı kısım */
const GIZLI_NOT    = "First kiss'i sen alacaksın,\nsuşiyi de sen yiyeceksin.\nSöz.";

/* oyunların içinde uçuşan kelimeler */
const KELIMELER = ['aşkım','bitanem','hayatım','canım','meleğim','güzelim',
                   'ömrüm','kalbim','biricik','Tuanam','canımın içi','sevgilim'];
/* ═══════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const kis = (v,a,b) => v<a?a:v>b?b:v;
const rast = (a,b) => a + Math.random()*(b-a);
const sec = a => a[(Math.random()*a.length)|0];
const bekle = ms => new Promise(r=>setTimeout(r,ms));
const TAU = Math.PI*2;

let _torba = [];
function kelime(){
  if(!_torba.length){
    _torba = KELIMELER.slice();
    for(let i=_torba.length-1;i>0;i--){
      const j=(Math.random()*(i+1))|0; [_torba[i],_torba[j]]=[_torba[j],_torba[i]];
    }
  }
  return _torba.pop();
}

/* ══════════════════════ SES ══════════════════════ */
const Ses = (() => {
  let ctx=null, ana=null, rev=null, hazir=false, acikMi=true, ped=null, pedG=null;
  /* la majör pentatonik, üç oktav */
  const P = [220,246.94,277.18,329.63,369.99,440,493.88,554.37,659.25,739.99,880,987.77,1108.73,1318.5];

  function ir(sure, gec){
    const sr=ctx.sampleRate, n=Math.floor(sr*sure), pre=Math.floor(sr*gec);
    const b=ctx.createBuffer(2,n,sr);
    for(let c=0;c<2;c++){
      const d=b.getChannelData(c);
      for(let i=0;i<n;i++){
        if(i<pre){ d[i]=0; continue; }
        const t=(i-pre)/(n-pre);
        d[i]=(Math.random()*2-1)*Math.pow(1-t,2.5)*(1-Math.exp(-t*70));
      }
    }
    return b;
  }
  function kur(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{ ctx = new AC(); }catch(e){ return; }
    const komp = ctx.createDynamicsCompressor();
    komp.threshold.value=-17; komp.knee.value=26; komp.ratio.value=3.2;
    komp.attack.value=0.006; komp.release.value=0.28;
    const yumusat = ctx.createBiquadFilter();
    yumusat.type='lowpass'; yumusat.frequency.value=8200; yumusat.Q.value=0.5;
    ana = ctx.createGain(); ana.gain.value=0.9;
    ana.connect(yumusat); yumusat.connect(komp); komp.connect(ctx.destination);
    rev = ctx.createConvolver(); rev.buffer = ir(3.4, 0.022);
    const rg = ctx.createGain(); rg.gain.value=0.42;
    rev.connect(rg); rg.connect(ana);
    hazir = true;
  }
  function uyan(){ kur(); if(ctx && ctx.state==='suspended') ctx.resume(); }
  function cikis(g, yanki, pan){
    if(pan !== 0 && ctx.createStereoPanner){
      const p = ctx.createStereoPanner(); p.pan.value = kis(pan,-1,1);
      g.connect(p); p.connect(ana);
    } else g.connect(ana);
    if(yanki > 0){ const s=ctx.createGain(); s.gain.value=yanki; g.connect(s); s.connect(rev); }
  }
  /* çan — dört kısmi ses + açılıp kapanan filtre */
  function can(f, o={}){
    if(!hazir || !acikMi) return;
    const {ses=0.13, sure=2.8, gec=0, yanki=0.6, pan=0, parlak=1} = o;
    const t0 = ctx.currentTime + gec;
    const flt = ctx.createBiquadFilter(); flt.type='lowpass'; flt.Q.value=0.8;
    flt.frequency.setValueAtTime(Math.min(14000, f*8*parlak), t0);
    flt.frequency.exponentialRampToValueAtTime(Math.max(200, f*1.5), t0+sure*0.75);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(ses, t0+0.011);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+sure);
    [[1,1],[2.005,0.34],[3.01,0.15],[4.72,0.06]].forEach(([m,a]) => {
      const osc = ctx.createOscillator(); osc.type='sine'; osc.frequency.value=f*m;
      const og = ctx.createGain(); og.gain.value=a;
      osc.connect(og); og.connect(flt);
      osc.start(t0); osc.stop(t0+sure+0.1);
    });
    flt.connect(g); cikis(g, yanki, pan);
  }
  function nota(i,o){ can(P[kis(Math.round(i),0,P.length-1)], o); }
  function gurultu(o={}){
    if(!hazir || !acikMi) return;
    const {sure=0.5, ses=0.08, f0=600, f1=2600, q=1.1, gec=0, yanki=0.4, pan=0} = o;
    const t0 = ctx.currentTime + gec;
    const n = Math.max(64, Math.floor(ctx.sampleRate*sure));
    const buf = ctx.createBuffer(1,n,ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1 - i/n*0.35);
    const src = ctx.createBufferSource(); src.buffer=buf;
    const flt = ctx.createBiquadFilter(); flt.type='bandpass'; flt.Q.value=q;
    flt.frequency.setValueAtTime(f0,t0);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t0+sure);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(ses,t0+sure*0.2);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+sure);
    src.connect(flt); flt.connect(g); cikis(g, yanki, pan);
    src.start(t0); src.stop(t0+sure+0.03);
  }
  /* yüksek pırıltı bulutu */
  function pirilti(o={}){
    const {ses=0.045, adet=5, gec=0} = o;
    for(let i=0;i<adet;i++)
      can(P[9 + ((Math.random()*5)|0)], {ses, sure:2.6, gec:gec+i*0.05,
        pan:rast(-.7,.7), yanki:0.8, parlak:1.4});
  }
  /* akor */
  function akor(kok, o={}){
    const {ses=0.1, sure=5, gec=0} = o;
    [0,2,4,6,8].forEach((k,i) =>
      can(P[kis(kok+k,0,P.length-1)], {ses:ses*(1-i*0.13), sure:sure*(1-i*0.07),
        gec:gec+i*0.055, pan:(i-2)*0.24, yanki:0.85}));
  }
  function dizi(n, adim=0.09, o={}){
    for(let i=0;i<n;i++) can(P[kis(4+i,0,P.length-1)],
      {gec:i*adim, ses:o.ses||0.11, sure:2.2, pan:rast(-.4,.4)});
  }
  /* yükselen gerilim */
  function yukselis(sure=1.2){
    gurultu({sure, ses:0.05, f0:300, f1:5200, q:2.4, yanki:0.5});
  }
  /* sürekli, çok kısık zemin sesi */
  function pedBasla(){
    if(ped || !hazir) return;
    pedG = ctx.createGain(); pedG.gain.value = 0.0001;
    pedG.gain.exponentialRampToValueAtTime(0.055, ctx.currentTime+7);
    const flt = ctx.createBiquadFilter(); flt.type='lowpass';
    flt.frequency.value=560; flt.Q.value=0.7;
    const lfo = ctx.createOscillator(); lfo.frequency.value=0.042;
    const lg = ctx.createGain(); lg.gain.value=280;
    lfo.connect(lg); lg.connect(flt.frequency); lfo.start();
    ped = [];
    [110, 164.81, 220, 329.63].forEach((f,i) => {
      const o = ctx.createOscillator();
      o.type = i%2 ? 'triangle' : 'sine';
      o.frequency.value = f * (1 + (i-1.5)*0.0016);
      const og = ctx.createGain(); og.gain.value = [0.55,0.3,0.26,0.14][i];
      o.connect(og); og.connect(flt); o.start();
      ped.push(o);
    });
    flt.connect(pedG); cikis(pedG, 0.55, 0);
  }
  function ayar(v){ acikMi=v; if(ana) ana.gain.value = v?0.9:0; return acikMi; }
  return { uyan, pedBasla, can, nota, gurultu, akor, dizi, pirilti, yukselis,
           puf:()=>gurultu({sure:0.26, ses:0.045, f0:1900, f1:520, q:0.9}),
           ayar, durum:()=>acikMi };
})();

const arka = $('#arka'), ac = arka.getContext('2d');
const oyunC = $('#oyun'), oc = oyunC.getContext('2d');
const ui = $('#ui');

let W=0,H=0,AW=0,AH=0, aktif=null, parlama=0;

function olc(){
  const dpr = Math.min(devicePixelRatio||1, 2.5);
  const ra = arka.getBoundingClientRect();
  if(ra.width && ra.height){
    AW=ra.width; AH=ra.height;
    arka.width=Math.round(AW*dpr); arka.height=Math.round(AH*dpr);
    ac.setTransform(dpr,0,0,dpr,0,0);
    manzaraKur();
  }
  const ro = oyunC.getBoundingClientRect();
  if(ro.width && ro.height){
    W=ro.width; H=ro.height;
    oyunC.width=Math.round(W*dpr); oyunC.height=Math.round(H*dpr);
    oc.setTransform(dpr,0,0,dpr,0,0);
    if(aktif && aktif.olc) aktif.olc();
  }
}
new ResizeObserver(olc).observe(arka);
new ResizeObserver(olc).observe(oyunC);

addEventListener('orientationchange', () => setTimeout(olc, 250));

function kalpYolu(c,x,y,s){
  c.beginPath();
  c.moveTo(x, y - s*0.34);
  c.bezierCurveTo(x-s*0.16, y-s*0.72, x-s*0.92, y-s*0.60, x-s*0.92, y-s*0.06);
  c.bezierCurveTo(x-s*0.92, y+s*0.34, x-s*0.42, y+s*0.60, x, y+s*0.94);
  c.bezierCurveTo(x+s*0.42, y+s*0.60, x+s*0.92, y+s*0.34, x+s*0.92, y-s*0.06);
  c.bezierCurveTo(x+s*0.92, y-s*0.60, x+s*0.16, y-s*0.72, x, y-s*0.34);
  c.closePath();
}
function isik(c,x,y,r,renk,guc){
  if(r<=0 || guc<=0) return;
  const g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, renk.replace('ALPHA',guc));
  g.addColorStop(1, renk.replace('ALPHA',0));
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
}
/* okunsun diye gölgeli yazı */
function yazi(c,t,x,y,f,renk,al){
  c.save(); c.globalAlpha=kis(al,0,1);
  c.font=f; c.textAlign='center'; c.textBaseline='middle';
  c.shadowColor='rgba(20,6,34,.85)'; c.shadowBlur=14;
  c.fillStyle=renk; c.fillText(t,x,y);
  c.shadowBlur=0; c.fillText(t,x,y);
  c.restore();
}

/* ══════════════════════ MANZARA ══════════════════════ */
let kat=[], bokeh=[], tepeler=[], agaclar=[], boce=[], kayan=null, kayanSay=4, saat=0;

function manzaraKur(){
  /* üç derinlikte yıldız */
  kat = [];
  const yogun = [1/9000, 1/5200, 1/3000];
  const boy   = [[.4,.9],[.6,1.3],[.9,2.0]];
  const hiz   = [1.4, 3.2, 6.4];
  for(let k=0;k<3;k++){
    const n = Math.round(AW*AH*yogun[k]);
    const a = [];
    for(let i=0;i<n;i++)
      a.push({x:Math.random()*AW, y:Math.random()*AH*0.76,
        r:rast(boy[k][0],boy[k][1]), f:rast(.3,1), h:rast(0,TAU), v:rast(.5,1.8), s:hiz[k]});
    kat.push(a);
  }
  /* yumuşak ışık topları */
  bokeh = [];
  for(let i=0;i<9;i++)
    bokeh.push({x:Math.random()*AW, y:rast(AH*.08,AH*.74), r:rast(26,88),
      o:rast(.025,.075), vx:rast(-5,5), vy:rast(-4,-1),
      c: Math.random()<.5 ? '255,168,196' : '250,208,140', h:rast(0,TAU)});
  /* ateşböcekleri */
  boce = [];
  for(let i=0;i<9;i++)
    boce.push({x:Math.random()*AW, y:rast(AH*.55,AH*.9), h:rast(0,TAU),
      hz:rast(.25,.6), a:rast(14,44), b:rast(8,26), p:rast(0,TAU), pv:rast(.7,1.8)});
  /* tepeler: üç katman */
  tepeler = [];
  const taban = [0.90, 0.945, 0.985];
  const yuk   = [0.075, 0.055, 0.04];
  for(let k=0;k<3;k++){
    const p=[], n=7;
    for(let i=0;i<=n;i++)
      p.push({x:(i/n)*AW, y:AH*taban[k] - AH*yuk[k]*(0.35+Math.random()*0.65)});
    tepeler.push(p);
  }
  /* ağaç siluetleri en arkadaki tepenin üstünde */
  agaclar = [];
  for(let i=0;i<7;i++){
    const x = rast(AW*0.04, AW*0.96);
    agaclar.push({x, y: tepeNokta(0,x) + 2, h: rast(AH*0.032, AH*0.062)});
  }
}
function tepeNokta(k,x){
  const p = tepeler[k]; if(!p||p.length<2) return AH*0.9;
  const adim = AW/(p.length-1);
  const i = kis(Math.floor(x/adim), 0, p.length-2);
  const t = kis((x - i*adim)/adim, 0, 1);
  const yum = t*t*(3-2*t);
  return p[i].y + (p[i+1].y - p[i].y)*yum;
}
function tepeCiz(k, renk){
  const p = tepeler[k]; if(!p) return;
  ac.beginPath(); ac.moveTo(0, AH+2);
  ac.lineTo(0, p[0].y);
  for(let i=0;i<p.length-1;i++){
    const mx=(p[i].x+p[i+1].x)/2, my=(p[i].y+p[i+1].y)/2;
    ac.quadraticCurveTo(p[i].x, p[i].y, mx, my);
  }
  ac.lineTo(AW, p[p.length-1].y); ac.lineTo(AW, AH+2);
  ac.closePath(); ac.fillStyle=renk; ac.fill();
}
function cizArka(dt){
  saat += dt;
  ac.clearRect(0,0,AW,AH);

  /* kuzey ışıkları */
  for(let b=0;b<2;b++){
    const ta = AH*(0.16+b*0.12), gen=AH*0.11;
    const g = ac.createLinearGradient(0,ta-gen,0,ta+gen);
    const renk = b ? '167,120,224' : '120,178,214';
    g.addColorStop(0, `rgba(${renk},0)`);
    g.addColorStop(.5, `rgba(${renk},${b?0.055:0.045})`);
    g.addColorStop(1, `rgba(${renk},0)`);
    ac.fillStyle=g;
    ac.beginPath(); ac.moveTo(0, ta);
    for(let x=0;x<=AW;x+=18)
      ac.lineTo(x, ta + Math.sin(x/AW*4.2 + saat*(0.16+b*0.09) + b*2)*gen*0.62);
    ac.lineTo(AW, ta+gen*1.5); ac.lineTo(0, ta+gen*1.5); ac.closePath(); ac.fill();
  }

  /* ay + hale */
  const ax=AW*0.775, ay=AH*0.125, ar=Math.min(AW,AH)*0.075;
  isik(ac,ax,ay,ar*9,'rgba(255,236,204,ALPHA)',.11);
  isik(ac,ax,ay,ar*3.1,'rgba(255,240,214,ALPHA)',.16);
  ac.strokeStyle='rgba(255,238,206,.09)'; ac.lineWidth=1.2;
  ac.beginPath(); ac.arc(ax,ay,ar*2.15,0,TAU); ac.stroke();
  const ag=ac.createRadialGradient(ax-ar*.34,ay-ar*.36,ar*.12,ax,ay,ar*1.02);
  ag.addColorStop(0,'#FFFCF2'); ag.addColorStop(.72,'#FBEBC8'); ag.addColorStop(1,'#EFD3A0');
  ac.fillStyle=ag; ac.beginPath(); ac.arc(ax,ay,ar,0,TAU); ac.fill();
  ac.fillStyle='rgba(206,172,124,.26)';
  ac.beginPath(); ac.arc(ax+ar*.3,ay-ar*.2,ar*.2,0,TAU); ac.fill();
  ac.beginPath(); ac.arc(ax-ar*.3,ay+ar*.28,ar*.135,0,TAU); ac.fill();
  ac.beginPath(); ac.arc(ax+ar*.04,ay+ar*.46,ar*.095,0,TAU); ac.fill();
  ac.beginPath(); ac.arc(ax-ar*.05,ay-ar*.5,ar*.07,0,TAU); ac.fill();

  /* yıldızlar — üç derinlik, farklı hızda kayıyor */
  for(let k=0;k<kat.length;k++){
    for(const s of kat[k]){
      s.h += dt*s.v;
      s.x += dt*s.s*0.9; if(s.x > AW+4) s.x = -4;
      const p = 0.36 + 0.64*(0.5+0.5*Math.sin(s.h));
      ac.globalAlpha = s.f*p*(0.5+k*0.25);
      ac.fillStyle='#FFF8E8';
      ac.beginPath(); ac.arc(s.x,s.y,s.r,0,TAU); ac.fill();
      if(s.r>1.5){
        ac.globalAlpha=s.f*p*.4; ac.strokeStyle='#FFF8E8'; ac.lineWidth=.7;
        ac.beginPath();
        ac.moveTo(s.x-s.r*3.8,s.y); ac.lineTo(s.x+s.r*3.8,s.y);
        ac.moveTo(s.x,s.y-s.r*3.8); ac.lineTo(s.x,s.y+s.r*3.8);
        ac.stroke();
      }
    }
  }
  ac.globalAlpha=1;

  /* ışık topları */
  for(const b of bokeh){
    b.x += b.vx*dt; b.y += b.vy*dt; b.h += dt*0.5;
    if(b.y < -b.r){ b.y = AH*0.8; b.x = Math.random()*AW; }
    if(b.x < -b.r) b.x = AW+b.r; if(b.x > AW+b.r) b.x = -b.r;
    isik(ac, b.x, b.y, b.r, `rgba(${b.c},ALPHA)`, b.o*(0.7+0.3*Math.sin(b.h)));
  }

  /* kayan yıldız */
  kayanSay -= dt;
  if(kayanSay<=0 && !kayan){
    kayan={x:rast(AW*.1,AW*.8), y:rast(AH*.04,AH*.32), l:0, a:rast(.5,.9), h:1};
    kayanSay=rast(5,12);
  }
  if(kayan){
    kayan.l += dt*470; kayan.h -= dt*.55;
    const dx=Math.cos(kayan.a), dy=Math.sin(kayan.a);
    const g=ac.createLinearGradient(kayan.x,kayan.y,kayan.x+dx*kayan.l,kayan.y+dy*kayan.l);
    g.addColorStop(0,'rgba(255,248,232,0)');
    g.addColorStop(1,`rgba(255,248,232,${Math.max(0,kayan.h)*.9})`);
    ac.strokeStyle=g; ac.lineWidth=2.1; ac.lineCap='round';
    ac.beginPath(); ac.moveTo(kayan.x,kayan.y);
    ac.lineTo(kayan.x+dx*kayan.l,kayan.y+dy*kayan.l); ac.stroke();
    if(kayan.h<=0) kayan=null;
  }

  /* tepeler ve ağaçlar */
  tepeCiz(0,'#1B0F33');
  ac.save();
  for(const t of agaclar){
    ac.fillStyle='#1B0F33';
    ac.beginPath();
    ac.moveTo(t.x, t.y - t.h);
    ac.lineTo(t.x - t.h*0.26, t.y+1);
    ac.lineTo(t.x + t.h*0.26, t.y+1);
    ac.closePath(); ac.fill();
    ac.beginPath();
    ac.moveTo(t.x, t.y - t.h*0.72);
    ac.lineTo(t.x - t.h*0.34, t.y+1);
    ac.lineTo(t.x + t.h*0.34, t.y+1);
    ac.closePath(); ac.fill();
  }
  ac.restore();
  tepeCiz(1,'#140924');
  tepeCiz(2,'#0C0518');

  /* ateşböcekleri (tepelerin önünde) */
  for(const f of boce){
    f.h += dt*f.hz; f.p += dt*f.pv;
    const x = f.x + Math.sin(f.h)*f.a, y = f.y + Math.cos(f.h*1.37)*f.b;
    const par = 0.35 + 0.65*Math.max(0, Math.sin(f.p));
    isik(ac, x, y, 13, 'rgba(255,214,140,ALPHA)', 0.42*par);
    ac.globalAlpha = par; ac.fillStyle='#FFF0C8';
    ac.beginPath(); ac.arc(x,y,1.5,0,TAU); ac.fill();
  }
  ac.globalAlpha=1;

  /* alt karartma — yazılar okunsun */
  const kg = ac.createLinearGradient(0, AH*0.72, 0, AH);
  kg.addColorStop(0,'rgba(11,5,24,0)'); kg.addColorStop(1,'rgba(11,5,24,.85)');
  ac.fillStyle=kg; ac.fillRect(0, AH*0.72, AW, AH*0.28);
}

let sonT = performance.now();

  if(AW) cizArka(dt);

  if(aktif && aktif.ciz) aktif.ciz(dt,t);

    isik(oc, W/2, H*0.45, Math.max(W,H)*1.15, 'rgba(255,232,198,ALPHA)', parlama*parlama*0.5);
  }
  requestAnimationFrame(dongu);
}

function oyun1(){
  return new Promise(coz => {
    panel('Kalp Yağmuru','Gökten sana kalp yağıyor <b>Tuanam</b>. Beş tanesini yakala.');
    const HEDEF = 5;
    let alinan=0, cikma=0, bitti=false, seri=0;
    const kalpler=[], parca=[], yazilar=[];

    function dogur(){
      const altin = Math.random()<.3;
      kalpler.push({x:rast(44,Math.max(80,W-44)), y:-44, v:rast(60,86),
        s:altin?rast(22,26):rast(18,23), sal:rast(0,TAU), salH:rast(.8,1.5), altin, iz:[]});
    }
    aktif = {
      ciz(dt){
        if(!bitti){ cikma-=dt; if(cikma<=0){ dogur(); cikma=rast(0.34,0.52); } }
        for(let i=kalpler.length-1;i>=0;i--){
          const k=kalpler[i];
          k.y+=k.v*dt; k.sal+=k.salH*dt;
          const x=k.x+Math.sin(k.sal)*18; k.gx=x;
          k.iz.push({x,y:k.y}); if(k.iz.length>16) k.iz.shift();
          if(k.y>H+56){ kalpler.splice(i,1); continue; }
          for(let j=0;j<k.iz.length;j++){
            const q=k.iz[j], f=j/k.iz.length;
            oc.globalAlpha=f*0.24; oc.fillStyle=k.altin?'#FFE2B2':'#FFACC4';
            oc.beginPath(); oc.arc(q.x,q.y,k.s*0.17*f+0.6,0,TAU); oc.fill();
          }
          oc.globalAlpha=1;
          oc.save(); oc.translate(x,k.y); oc.rotate(Math.sin(k.sal)*0.2);
          isik(oc,0,0,k.s*3.4, k.altin?'rgba(248,206,133,ALPHA)':'rgba(255,127,162,ALPHA)',.36);
          const g=oc.createLinearGradient(0,-k.s,0,k.s);
          if(k.altin){ g.addColorStop(0,'#FFF4DA'); g.addColorStop(.55,'#FFD188'); g.addColorStop(1,'#E8992B'); }
          else { g.addColorStop(0,'#FFDCE6'); g.addColorStop(.55,'#FF8AAB'); g.addColorStop(1,'#F0416F'); }
          oc.fillStyle=g; kalpYolu(oc,0,0,k.s); oc.fill();
          /* kenar ışığı */
          oc.strokeStyle = k.altin ? 'rgba(255,245,220,.55)' : 'rgba(255,225,235,.5)';
          oc.lineWidth=1.2; kalpYolu(oc,0,0,k.s); oc.stroke();
          oc.globalAlpha=.65; oc.fillStyle='#FFFFFF';
          oc.beginPath(); oc.ellipse(-k.s*.34,-k.s*.3,k.s*.21,k.s*.12,-.5,0,TAU); oc.fill();
          oc.restore();
        }
        cizParca(dt,parca);
        cizYazi(dt,yazilar);
      },
      bas(x,y){
        if(bitti) return;
        for(let i=kalpler.length-1;i>=0;i--){
          const k=kalpler[i];
          if(Math.hypot((k.gx??k.x)-x, k.y-y) < k.s*1.8){
            kalpler.splice(i,1); alinan++; seri++;
            Ses.nota(3+Math.min(seri,8), {ses:k.altin?0.15:0.12, sure:2.6, pan:(x/W-0.5)*1.1});
            if(k.altin) Ses.pirilti({ses:0.04, adet:4});
            sayac(alinan + ' / ' + HEDEF);
            patlat(parca, k.gx??k.x, k.y, k.altin);
            yazilar.push({t:kelime(), x:k.gx??k.x, y:k.y, o:1, vy:-58,
              b:k.altin?30:27, altin:k.altin});
            if(alinan>=HEDEF){
              bitti=true;
              Ses.akor(4,{ses:0.1,sure:5.5}); Ses.pirilti({ses:0.05,adet:7});
              bitir('Hepsi senin <b>aşkım</b>.', 1700, coz);
            }
            return;
          }
        }
        seri=0;
      }
    };
    sayac('0 / '+HEDEF);
  });
}
function patlat(parca,x,y,altin){
  for(let j=0;j<(altin?34:24);j++){
    const a=Math.random()*TAU, h=rast(70,270);
    parca.push({x, y, vx:Math.cos(a)*h, vy:Math.sin(a)*h-70, r:rast(3,8), o:1,
      d:rast(.7,1.3), a:Math.random()*TAU,
      c: altin ? sec(['#FFE2B2','#F8CE85','#FFF6E2']) : sec(['#FF7FA2','#FFC0CE','#FFF4F7'])});
  }
}
function cizParca(dt,parca){
  for(let i=parca.length-1;i>=0;i--){
    const p=parca[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=190*dt; p.o-=p.d*dt; p.a+=dt*2.6;
    if(p.o<=0){ parca.splice(i,1); continue; }
    oc.save(); oc.globalAlpha=kis(p.o,0,1); oc.translate(p.x,p.y); oc.rotate(p.a);
    oc.fillStyle=p.c; kalpYolu(oc,0,0,p.r); oc.fill(); oc.restore();
  }
}
function cizYazi(dt,yazilar){
  for(let i=yazilar.length-1;i>=0;i--){
    const y=yazilar[i];
    y.y+=y.vy*dt; y.vy*=.96; y.o-=dt*.55;
    if(y.o<=0){ yazilar.splice(i,1); continue; }
    yazi(oc, y.t, kis(y.x,72,Math.max(80,W-72)), y.y,
      ELYAZI(y.b), y.altin?'#FFEBC8':'#FFD3DF', y.o);
  }
}

/* ═════════════ 2 · YILDIZ HARİTASI ═════════════ */
function oyun2(){
  return new Promise(coz => {
    panel('Yıldız Haritası','Yıldızları <b>sırayla</b> birleştir. Bakalım gökte ne saklıymış.');
    const N=15;
    let nok=[], sira=0, parmak=null, bitti=false, parla=0;
    const parca=[];
    function kur(){
      nok=[];
      const cx=W/2, cy=H*0.44, ol=Math.min(W*0.43,H*0.35)/16;
      for(let i=0;i<N;i++){
        const t=-Math.PI/2+(i/N)*TAU;
        nok.push({x:cx+16*Math.pow(Math.sin(t),3)*ol,
          y:cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*ol,
          h:rast(0,TAU)});
      }
    }
    kur();
    aktif = {
      olc:kur,
      ciz(dt){
        if(bitti) parla=Math.min(1,parla+dt*0.8);
        const cx=W/2, cy=H*0.44;
        if(sira>2||bitti) isik(oc,cx,cy,Math.min(W,H)*0.66,'rgba(255,140,178,ALPHA)',0.05+0.24*parla);
        if(bitti && parla>.06){
          oc.save(); oc.globalAlpha=parla*0.36;
          oc.beginPath(); oc.moveTo(nok[0].x,nok[0].y);
          for(let i=1;i<N;i++) oc.lineTo(nok[i].x,nok[i].y);
          oc.closePath();
          const g=oc.createLinearGradient(0,cy-H*.2,0,cy+H*.2);
          g.addColorStop(0,'#FFDCE6'); g.addColorStop(1,'#FF4275');
          oc.fillStyle=g; oc.fill(); oc.restore();
        }
        if(sira>0){
          oc.save();
          oc.strokeStyle=`rgba(248,206,133,${0.62+0.38*parla})`;
          oc.lineWidth=2+parla*1.8; oc.lineCap='round'; oc.lineJoin='round';
          oc.shadowColor='rgba(248,206,133,.85)'; oc.shadowBlur=16+parla*30;
          oc.beginPath(); oc.moveTo(nok[0].x,nok[0].y);
          for(let i=1;i<=Math.min(sira,N-1);i++) oc.lineTo(nok[i].x,nok[i].y);
          if(bitti) oc.closePath();
          oc.stroke(); oc.restore();
        }
        if(bitti && parla>.3)
          yazi(oc, O+'  +  '+SEN, cx, cy+Math.min(W,H)*0.02,
            ELYAZI(Math.round(Math.min(W,H)*0.098)), '#FFFBF2', (parla-.3)/.7);
        if(parmak && sira>0 && sira<N && !bitti){
          oc.save(); oc.strokeStyle='rgba(248,206,133,.38)'; oc.lineWidth=1.4;
          oc.setLineDash([4,7]);
          oc.beginPath(); oc.moveTo(nok[sira-1].x,nok[sira-1].y);
          oc.lineTo(parmak.x,parmak.y); oc.stroke(); oc.restore();
        }
        nok.forEach((p,i) => {
          p.h+=dt*2.2;
          const ok=i<sira, su=(i===sira&&!bitti);
          const pul=su?(.55+.45*Math.sin(p.h*1.7)):1;
          isik(oc,p.x,p.y, su?36:24, (ok||su)?'rgba(248,206,133,ALPHA)':'rgba(176,160,214,ALPHA)',
            ok?.62 : su?.58*pul : .2);
          oc.fillStyle = ok?'#FFFCF2' : su?'#FFE9BE' : '#BCACDC';
          oc.globalAlpha = su ? .6+.4*pul : 1;
          oc.beginPath(); oc.arc(p.x,p.y, ok?6.6:4.6,0,TAU); oc.fill();
          oc.globalAlpha=1;
          if(su){
            oc.strokeStyle='rgba(255,233,190,.45)'; oc.lineWidth=1.4;
            oc.beginPath(); oc.arc(p.x,p.y,16+4.5*Math.sin(p.h),0,TAU); oc.stroke();
          }
        });
        for(let i=parca.length-1;i>=0;i--){
          const p=parca[i];
          p.x+=p.vx*dt; p.y+=p.vy*dt; p.o-=dt*.8;
          if(p.o<=0){ parca.splice(i,1); continue; }
          oc.globalAlpha=p.o; oc.fillStyle='#FFF0D4';
          oc.beginPath(); oc.arc(p.x,p.y,p.r,0,TAU); oc.fill();
        }
        oc.globalAlpha=1;
      },
      bas(x,y){ parmak={x,y}; dene(x,y); },
      hareket(x,y){ if(parmak){ parmak={x,y}; dene(x,y); } },
      birak(){ parmak=null; }
    };
    function dene(x,y){
      if(bitti||sira>=N) return;
      const p=nok[sira];
      if(Math.hypot(p.x-x,p.y-y)<44){
        Ses.nota(Math.min(sira,11), {ses:0.115, sure:2.7, pan:(p.x/W-0.5)*1.2});
        for(let i=0;i<16;i++){
          const a=Math.random()*TAU, h=rast(30,130);
          parca.push({x:p.x,y:p.y,vx:Math.cos(a)*h,vy:Math.sin(a)*h,r:rast(1,2.8),o:1});
        }
        sira++; sayac(sira+' / '+N);
        if(sira===N-3) Ses.yukselis(1.6);
        if(sira>=N){
          bitti=true;
          Ses.akor(5,{ses:0.12,sure:6.5});
          Ses.pirilti({ses:0.05,adet:9});
          bitir('Ben bunu çoktan biliyordum <b>bitanem</b>.', 3200, coz);
        }
      }
    }
    sayac('0 / '+N);
  });
}

/* ═════════════ 3 · AŞK ÖLÇER ═════════════ */
function oyun3(){
  return new Promise(coz => {
    panel('Aşk Ölçer','Bakalım seni ne kadar seviyorum. <b>Kalbe hızlı hızlı dokun.</b>');
    const SON=2200;
    let deger=0, hedef=0, bitti=false, vur=0, uyari=false;
    const parca=[], yazilar=[];
    const ASAMA=[{v:100,t:'%100'},{v:300,t:'%300'},{v:750,t:'%750'},
                 {v:1500,t:'%1500'},{v:SON,t:'%'+SON}];
    function fisek(g){
      const a=Math.random()*TAU, h=rast(110,480)*g;
      parca.push({x:W/2, y:H*0.42, vx:Math.cos(a)*h, vy:Math.sin(a)*h-160,
        r:rast(5,14), o:rast(1,1.9), d:rast(.4,.8), a:Math.random()*TAU,
        c:sec(['#FF7FA2','#FFC0CE','#F8CE85','#FFE4BF','#FFF4F7'])});
    }
    aktif = {
      ciz(dt,t){
        deger += (hedef-deger)*Math.min(1,dt*7);
        vur = Math.max(0, vur-dt*3.4);
        const p=kis(deger/SON,0,1);
        const s=Math.min(W,H)*(0.16+0.105*p)*(1+Math.sin(t/160)*0.024*(1+p*2)+vur*0.1);
        const cx=W/2, cy=H*0.42;
        isik(oc,cx,cy,s*4.2,'rgba(255,110,150,ALPHA)',.2+.36*p+vur*.14);
        /* halkalar */
        for(let i=0;i<3;i++){
          const r=s*(1.4+i*0.42)+Math.sin(t/620+i)*4;
          oc.strokeStyle=`rgba(255,160,190,${(0.10-i*0.026)*(0.5+p)})`;
          oc.lineWidth=1.2; oc.beginPath(); oc.arc(cx,cy,r,0,TAU); oc.stroke();
        }
        oc.save(); oc.translate(cx,cy);
        const g=oc.createLinearGradient(0,-s,0,s);
        g.addColorStop(0,'#FFE0E9'); g.addColorStop(.5,'#FF7B9E'); g.addColorStop(1,'#DA2A5F');
        oc.shadowColor='rgba(255,85,128,.85)'; oc.shadowBlur=36+50*p;
        oc.fillStyle=g; kalpYolu(oc,0,0,s); oc.fill();
        oc.shadowBlur=0;
        oc.strokeStyle='rgba(255,230,240,.5)'; oc.lineWidth=1.5;
        kalpYolu(oc,0,0,s); oc.stroke();
        oc.globalAlpha=.6; oc.fillStyle='#FFFFFF';
        oc.beginPath(); oc.ellipse(-s*.34,-s*.3,s*.19,s*.105,-.5,0,TAU); oc.fill();
        oc.restore();
        yazi(oc, bitti?'∞':('%'+Math.round(deger)), cx, cy+s*0.06,
          `${bitti?600:400} ${Math.round(s*(bitti?0.8:0.44))}px 'Cormorant Garamond', serif`,
          '#4B0F23', .9);
        cizParca(dt,parca);
        cizYazi(dt,yazilar);
        if(bitti && Math.random()<dt*24) fisek(1);
      },
      bas(x,y){
        if(bitti) return;
        hedef += rast(52,88); vur=1;
        Ses.nota(kis(2+Math.round((hedef/SON)*10),2,13), {ses:0.09, sure:1.3, yanki:0.35, pan:rast(-.4,.4)});
        for(let i=0;i<9;i++) fisek(0.55);
        if(Math.random()<.34)
          yazilar.push({t:kelime(), x:rast(84,Math.max(94,W-84)), y:H*0.24, o:1, vy:-58, b:28});
        const a=ASAMA.find(a=>hedef<a.v);
        sayac(a ? a.t+'…' : 'sonsuz');
        if(hedef > SON*0.72 && !uyari){ uyari=true; Ses.yukselis(1.8); }
        if(hedef>=SON && !bitti){
          bitti=true; sayac('sonsuz');
          Ses.akor(5,{ses:0.14,sure:8});
          Ses.pirilti({ses:0.06,adet:12});
          Ses.dizi(8,0.07,{ses:0.1});
          for(let i=0;i<120;i++) fisek(1);
          bitir('Ölçek bozuldu <b>aşkım</b>. Bu kadarı ölçülmüyor.', 3400, coz);
        }
      }
    };
    sayac('%0');
  });
}

/* ══════════════════════ AKIŞ ══════════════════════ */
const OYUNLAR = [
  {ad:'Kalp Yağmuru',    f:oyun1},
  {ad:'Yıldız Haritası', f:oyun2},
  {ad:'Aşk Ölçer',       f:oyun3}
];

function tertemiz(){ aktif=null; ui.innerHTML=''; if(W) oc.clearRect(0,0,W,H); }

async function akis(){
  for(let i=0;i<OYUNLAR.length;i++){
    tertemiz(); olc();
    await OYUNLAR[i].f();
    tertemiz(); kalpVer(i); await bekle(420);
    if(i<NOTLAR.length) await kartGoster(NOTLAR[i]);
  }
  final();
}

function final(){
  tertemiz();
  panel('','');
  $('#alt').hidden = true;
  $('#sonbaslik').textContent = FINAL_BASLIK;
  $('#sonmesaj').textContent  = FINAL_MESAJ;
  $('#songizli').textContent  = GIZLI_NOT;
  $('#sonimza').textContent   = SEN;
  $('#son').classList.add('ac');
  Ses.akor(4,{ses:0.13,sure:9});
  Ses.dizi(6,0.12,{ses:0.095});
  Ses.pirilti({ses:0.04,adet:8,gec:0.7});
  const p=[];
  aktif = {
    ciz(dt){
      if(Math.random()<dt*6)
        p.push({x:rast(0,W), y:-26, v:rast(24,58), s:rast(7,17), h:rast(0,TAU),
          c:sec(['rgba(255,127,162,.5)','rgba(248,206,133,.4)','rgba(255,192,206,.5)'])});
      for(let i=p.length-1;i>=0;i--){
        const q=p[i]; q.y+=q.v*dt; q.h+=dt;
        if(q.y>H+30){ p.splice(i,1); continue; }
        oc.save(); oc.translate(q.x+Math.sin(q.h)*20, q.y); oc.rotate(Math.sin(q.h)*.3);
        oc.fillStyle=q.c; kalpYolu(oc,0,0,q.s); oc.fill(); oc.restore();
      }
    }
  };
}

/* ══════════════════════ AÇILIŞ SAHNESİ ══════════════════════ */
function acilisSahnesi(){
  const p=[];
  aktif = {
    ciz(dt){
      if(Math.random()<dt*2.6)
        p.push({x:rast(0,W), y:H+30, v:rast(16,38), s:rast(6,15), h:rast(0,TAU),
          c:sec(['rgba(255,127,162,.34)','rgba(248,206,133,.26)','rgba(255,192,206,.32)'])});
      for(let i=p.length-1;i>=0;i--){
        const q=p[i]; q.y-=q.v*dt; q.h+=dt*0.8;
        if(q.y<-30){ p.splice(i,1); continue; }
        oc.save(); oc.translate(q.x+Math.sin(q.h)*16, q.y); oc.rotate(Math.sin(q.h)*.28);
        oc.fillStyle=q.c; kalpYolu(oc,0,0,q.s); oc.fill(); oc.restore();
      }
    }
  };
}

  stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l4.5-3.5v13L7 15H4z" fill="#F8CE85"/>
  <path d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>`;
const SES_KAPALI = `<svg viewBox="0 0 24 24" fill="none" stroke="#B0A0D6" stroke-width="1.7"
  stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l4.5-3.5v13L7 15H4z" fill="#B0A0D6"/>
  <path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>`;
function sesGuncelle(){ $('#sesbtn').innerHTML = Ses.durum() ? SES_ACIK : SES_KAPALI; }
$('#sesbtn').onclick = () => { Ses.ayar(!Ses.durum()); sesGuncelle(); if(Ses.durum()) Ses.nota(7,{ses:.11}); };

/* ══════════════════════ BAŞLANGIÇ ══════════════════════ */
$('#acilisnot').textContent = ACILIS_NOTU;
$('#kalpler').innerHTML = KP.repeat(OYUNLAR.length);
sesGuncelle();

const tk = $('#tekrar');
OYUNLAR.forEach(o => {
  const b=document.createElement('button');
  b.textContent=o.ad;
  b.onclick = async () => {
    $('#son').classList.remove('ac');
    $('#alt').hidden = false;
    tertemiz(); olc();
    await o.f();
    tertemiz(); await bekle(360);
    final();
  };
  tk.appendChild(b);
});
olc();
acilisSahnesi();

$('#baslabtn').onclick = () => {
  Ses.uyan(); Ses.pedBasla();
  Ses.nota(7,{ses:0.13}); Ses.pirilti({ses:0.035,adet:5,gec:0.1});
  $('#acilis').style.display='none';
  $('#ust').hidden=false; $('#alt').hidden=false;
  tertemiz(); olc(); akis();
};
setTimeout(olc,80);
setTimeout(olc,420);
</script>
